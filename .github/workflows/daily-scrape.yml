name: Daily price scrape

on:
  schedule:
    # 02:00 UTC = 06:00 Yerevan (UTC+4)
    - cron: "0 2 * * *"
  workflow_dispatch: {}  # lets you trigger a run manually from the Actions tab

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt
        # Chrome ships preinstalled on ubuntu-latest runners, and Selenium
        # 4.6+'s built-in driver manager auto-downloads a matching
        # chromedriver on first use — no separate browser install step.

      - name: Run daily scrape
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python -m scraper.run_daily
