<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Armenia Air Purifier Prices</title>
<style>
  :root {
    --bg: #0b0f14; --panel: #121821; --panel-2: #1a2230; --border: #263142;
    --text: #e8edf4; --text-dim: #93a1b5; --accent: #5aa7ff; --good: #3ecf8e;
    --warn: #e0a940; --bad: #ef5b5b;
  }
  @media (prefers-color-scheme: light) {
    :root { --bg:#f5f7fa; --panel:#fff; --panel-2:#eef1f5; --border:#dde3ea; --text:#1b2430; --text-dim:#5a6679; }
  }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font-family: -apple-system, Segoe UI, Roboto, Arial, sans-serif; }
  header { padding: 24px 28px 8px; }
  h1 { font-size: 20px; margin: 0 0 4px; }
  .sub { color: var(--text-dim); font-size: 13px; }
  .controls { display:flex; gap:10px; flex-wrap:wrap; padding: 16px 28px; align-items:center; }
  .controls input, .controls select {
    background: var(--panel); border:1px solid var(--border); color:var(--text);
    padding: 8px 10px; border-radius: 8px; font-size: 13px;
  }
  .fx-note { color: var(--text-dim); font-size: 12px; margin-left:auto; }
  main { padding: 0 28px 40px; }
  table { width:100%; border-collapse: collapse; background:var(--panel); border-radius:12px; overflow:hidden; }
  th, td { padding: 10px 12px; text-align:left; border-bottom:1px solid var(--border); font-size: 13px; vertical-align: top; }
  th { color: var(--text-dim); font-weight:600; font-size:11px; text-transform:uppercase; letter-spacing:.04em; background:var(--panel-2); }
  tr:hover td { background: var(--panel-2); }
  .product-name { font-weight:600; }
  .product-name a { color: inherit; text-decoration:none; }
  .product-name a:hover { color: var(--accent); }
  .brand { color: var(--text-dim); font-size:12px; }
  .price-amd { font-weight:700; font-size:14px; }
  .price-alt { color: var(--text-dim); font-size:11.5px; }
  .badge { display:inline-block; padding:2px 7px; border-radius:999px; font-size:11px; font-weight:600; }
  .badge.in { background: rgba(62,207,142,.15); color: var(--good); }
  .badge.out { background: rgba(239,91,91,.15); color: var(--bad); }
  .rating { font-size:12px; color: var(--text-dim); }
  .site-pill { display:inline-block; padding:2px 8px; border-radius:6px; background:var(--panel-2); border:1px solid var(--border); font-size:11px; }
  .health { padding: 0 28px 8px; display:flex; gap:8px; flex-wrap:wrap; }
  .health .chip { font-size:11px; padding:4px 9px; border-radius:999px; border:1px solid var(--border); color: var(--text-dim); }
  .health .chip.fresh { color: var(--good); border-color: rgba(62,207,142,.3); }
  .health .chip.stale { color: var(--warn); border-color: rgba(224,169,64,.3); }
  .health .chip.dead { color: var(--bad); border-color: rgba(239,91,91,.3); }
  .empty { color: var(--text-dim); padding: 40px; text-align:center; }
</style>
</head>
<body>
<header>
  <h1>Armenia Air Purifier Prices</h1>
  <div class="sub">Internal price-comparison tool &middot; updated daily from each site's own listing &middot; prices shown in AMD with USD / KZT equivalents</div>
</header>

<div class="health" id="health"></div>

<div class="controls">
  <input id="search" type="text" placeholder="Search name or brand...">
  <select id="siteFilter"><option value="">All sites</option></select>
  <select id="sortBy">
    <option value="price_asc">Price: low to high</option>
    <option value="price_desc">Price: high to low</option>
    <option value="rating_desc">Rating: high to low</option>
    <option value="site">Site</option>
  </select>
  <span class="fx-note" id="fxNote"></span>
</div>

<main>
  <table id="table">
    <thead>
      <tr>
        <th>Product</th><th>Site</th><th>Price</th><th>Stock</th>
        <th>Rating</th><th>Shipping</th><th>Last checked</th>
      </tr>
    </thead>
    <tbody id="rows"></tbody>
  </table>
  <div class="empty" id="emptyMsg" style="display:none">No data yet — run the scraper, or widen your filters.</div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script>
// --- Fill these in from your Supabase project settings (Project Settings > API).
// The anon/public key is designed to be exposed in client-side code like this —
// Row Level Security (see db/schema.sql) restricts it to read-only. Never put the
// service_role key here.
const SUPABASE_URL = "https://YOUR-PROJECT.supabase.co";
const SUPABASE_ANON_KEY = "YOUR-ANON-PUBLIC-KEY";

const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

let allRows = [];
let fx = null;

function fmtAmd(n) {
  return n == null ? "—" : Math.round(n).toLocaleString("en-US") + " ֏";
}
function fmtUsd(n) { return n == null ? "" : "$" + n.toLocaleString("en-US", {maximumFractionDigits: 0}); }
function fmtKzt(n) { return n == null ? "" : n.toLocaleString("en-US", {maximumFractionDigits: 0}) + " KZT"; }

function timeAgo(iso) {
  const d = new Date(iso);
  const hrs = (Date.now() - d.getTime()) / 36e5;
  if (hrs < 1) return "just now";
  if (hrs < 24) return Math.round(hrs) + "h ago";
  return Math.round(hrs / 24) + "d ago";
}

async function loadHealth() {
  const { data } = await sb
    .from("scrape_runs")
    .select("site, started_at, status, products_found")
    .order("started_at", { ascending: false })
    .limit(500);
  if (!data) return;
  const latestBySite = {};
  for (const r of data) if (!latestBySite[r.site]) latestBySite[r.site] = r;

  const el = document.getElementById("health");
  el.innerHTML = "";
  Object.values(latestBySite).forEach(r => {
    const hrs = (Date.now() - new Date(r.started_at).getTime()) / 36e5;
    let cls = "fresh";
    if (r.status === "error" || hrs > 24 * 10) cls = "dead";
    else if (hrs > 24 * 2) cls = "stale";
    const chip = document.createElement("span");
    chip.className = "chip " + cls;
    chip.textContent = `${r.site}: ${r.status === "error" ? "failed" : (r.products_found ?? "?") + " items"} (${timeAgo(r.started_at)})`;
    el.appendChild(chip);
  });
}

async function loadRows() {
  const { data, error } = await sb
    .from("latest_prices")
    .select("*")
    .order("scraped_at", { ascending: false });
  if (error) {
    document.getElementById("emptyMsg").style.display = "block";
    document.getElementById("emptyMsg").textContent = "Couldn't load data: " + error.message;
    return;
  }
  allRows = data || [];

  const sites = [...new Set(allRows.map(r => r.site))].sort();
  const siteFilter = document.getElementById("siteFilter");
  sites.forEach(s => {
    const opt = document.createElement("option");
    opt.value = s; opt.textContent = s;
    siteFilter.appendChild(opt);
  });

  const latestFx = allRows.find(r => r.fx_rate_date)?.fx_rate_date;
  if (latestFx) document.getElementById("fxNote").textContent = `FX rate date: ${latestFx}`;

  render();
}

function render() {
  const q = document.getElementById("search").value.trim().toLowerCase();
  const site = document.getElementById("siteFilter").value;
  const sortBy = document.getElementById("sortBy").value;

  let rows = allRows.filter(r => {
    if (site && r.site !== site) return false;
    if (q && !(r.name.toLowerCase().includes(q) || (r.brand || "").toLowerCase().includes(q))) return false;
    return true;
  });

  rows.sort((a, b) => {
    if (sortBy === "price_asc") return (a.price_amd ?? Infinity) - (b.price_amd ?? Infinity);
    if (sortBy === "price_desc") return (b.price_amd ?? -Infinity) - (a.price_amd ?? -Infinity);
    if (sortBy === "rating_desc") return (b.rating ?? -1) - (a.rating ?? -1);
    return a.site.localeCompare(b.site);
  });

  const tbody = document.getElementById("rows");
  tbody.innerHTML = "";
  document.getElementById("emptyMsg").style.display = rows.length ? "none" : "block";

  for (const r of rows) {
    const tr = document.createElement("tr");
    tr.innerHTML = `
      <td>
        <div class="product-name"><a href="${r.product_url}" target="_blank" rel="noopener">${r.name}</a></div>
        <div class="brand">${r.brand || ""}</div>
      </td>
      <td><span class="site-pill">${r.site}</span></td>
      <td>
        <div class="price-amd">${fmtAmd(r.price_amd)}</div>
        <div class="price-alt">${fmtUsd(r.price_usd)} &middot; ${fmtKzt(r.price_kzt)}</div>
        ${r.list_price_amd ? `<div class="price-alt" style="text-decoration:line-through">${fmtAmd(r.list_price_amd)}</div>` : ""}
      </td>
      <td>${r.in_stock === false ? '<span class="badge out">Out of stock</span>' : r.in_stock === true ? '<span class="badge in">In stock</span>' : "—"}</td>
      <td class="rating">${r.rating ? "★ " + r.rating + (r.review_count ? ` (${r.review_count})` : "") : "—"}</td>
      <td class="rating">${r.shipping_price_amd ? fmtAmd(r.shipping_price_amd) : (r.shipping_time_text || "—")}</td>
      <td class="rating">${timeAgo(r.scraped_at)}</td>
    `;
    tbody.appendChild(tr);
  }
}

document.getElementById("search").addEventListener("input", render);
document.getElementById("siteFilter").addEventListener("change", render);
document.getElementById("sortBy").addEventListener("change", render);

loadHealth();
loadRows();
</script>
</body>
</html>
